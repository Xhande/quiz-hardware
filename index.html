<script>
    const questions = [
        {
            question: "Qual componente é considerado o 'cérebro' do computador, responsável por processar dados e executar instruções?",
            options: ["Placa de Vídeo (GPU)", "Memória RAM", "Processador (CPU)", "Disco Rígido (HD)"],
            answer: 2,
            explanation: "A CPU (Unidade Central de Processamento) gerencia e executa as instruções do sistema e dos programas."
        },
        {
            question: "Qual tipo de memória é volátil, ou seja, perde todos os dados quando o computador é desligado?",
            options: ["Memória RAM", "SSD", "ROM", "HD Externo"],
            answer: 0,
            explanation: "A memória RAM armazena temporariamente os dados que o computador precisa no momento, sendo esvaziada ao desligar o sistema."
        },
        {
            question: "Qual dispositivo de armazenamento abaixo oferece maior velocidade de leitura e escrita de dados?",
            options: ["HD SATA III", "Pendrive USB 2.0", "SSD NVMe M.2", "Disco Óptico (DVD)"],
            answer: 2,
            explanation: "Os SSDs NVMe M.2 utilizam o barramento PCIe, oferecendo velocidades muito superiores aos HDs e SSDs SATA tradicionais."
        },
        {
            question: "Qual componente é responsável por fornecer energia elétrica regulada a todas as peças do computador?",
            options: ["Placa-mãe", "Fonte de Alimentação", "Estabilizador", "Cooler"],
            answer: 1,
            explanation: "A fonte de alimentação converte a corrente alternada da tomada em corrente contínua necessária para os componentes internos."
        },
        {
            question: "Qual porta de conexão é amplamente utilizada para transmitir vídeo e áudio de alta definição digital simultaneamente?",
            options: ["VGA", "DVI", "HDMI", "PS/2"],
            answer: 2,
            explanation: "O HDMI suporta a transmissão integrada de áudio e vídeo em alta definição em um único cabo."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userName = "";

    function goToRegister() {
        document.getElementById("cover-screen").style.display = "none";
        document.getElementById("welcome-screen").style.display = "block";
    }

    function startQuiz() {
        const inputName = document.getElementById("username").value.trim();
        if (inputName === "") {
            alert("Por favor, informe seu nome para continuar!");
            return;
        }
        userName = inputName;
        document.getElementById("welcome-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById("progress").innerText = `Questão ${currentQuestionIndex + 1} de ${questions.length}`;
        document.getElementById("question-text").innerText = q.question;
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        document.getElementById("explanation").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("option-btn");
            button.onclick = () => selectOption(index);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const buttons = document.getElementById("options-container").children;

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === q.answer) {
                buttons[i].classList.add("correct");
            } else if (i === selectedIndex) {
                buttons[i].classList.add("wrong");
            }
        }

        if (selectedIndex === q.answer) {
            score++;
        }

        const explanation = document.getElementById("explanation");
        explanation.innerText = "Explicação: " + q.explanation;
        explanation.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("results-screen").style.display = "block";
        
        const percentage = Math.round((score / questions.length) * 100);
        document.getElementById("score-text").innerText = `${userName}, você acertou ${score} de ${questions.length} questões (${percentage}% de aproveitamento).`;

        saveRanking(userName, score, percentage);
        displayRanking();
    }

    function saveRanking(name, userScore, percentage) {
        let ranking = JSON.parse(localStorage.getItem("quizRanking")) || [];
        
        const existingPlayerIndex = ranking.findIndex(
            player => player.name.trim().toLowerCase() === name.trim().toLowerCase()
        );

        if (existingPlayerIndex !== -1) {
            if (userScore > ranking[existingPlayerIndex].score) {
                ranking[existingPlayerIndex].score = userScore;
                ranking[existingPlayerIndex].percentage = percentage;
            }
        } else {
            ranking.push({ name: name, score: userScore, percentage: percentage });
        }

        ranking.sort((a, b) => b.score - a.score);
        ranking = ranking.slice(0, 10);
        
        localStorage.setItem("quizRanking", JSON.stringify(ranking));
    }

    function displayRanking() {
        const rankingList = document.getElementById("ranking-list");
        rankingList.innerHTML = "";
        let ranking = JSON.parse(localStorage.getItem("quizRanking")) || [];

        if (ranking.length === 0) {
            rankingList.innerHTML = "<li class='ranking-item'>Nenhum resultado registrado ainda.</li>";
            return;
        }

        ranking.forEach((player, index) => {
            const li = document.createElement("li");
            li.classList.add("ranking-item");
            
            // Calcula a porcentagem se ela for undefined nos dados antigos
            let playerPercent = player.percentage;
            if (playerPercent === undefined || isNaN(playerPercent)) {
                playerPercent = Math.round((player.score / questions.length) * 100);
            }
            
            li.innerHTML = `
                <span>#${index + 1} ${player.name}</span> 
                <span>${player.score}/${questions.length} acertos (${playerPercent}%)</span>
            `;
            rankingList.appendChild(li);
        });
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("username").value = "";
        document.getElementById("results-screen").style.display = "none";
        document.getElementById("cover-screen").style.display = "block";
    }
</script>
